<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<style>
body{
    margin:100px;
    background-color: aqua;
}
.card{
    background-color: white;
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    border-radius : 5%; 
    padding: 20px;
}
.cover img{
    width:100%;
    height: 200px;
    border-radius: 15% 15% 0 0;
    position: relative;
}
.profile img{
    position: absolute;
    /* top:50%; */
    bottom: 47%;
    right: 48%;

}
.stats{
    display: flex;
    justify-content: center;
    gap: 25px;
}
.stats h3{
    color: aqua;
    font-size: 30px;
}
button{
    padding-left: 20px;
    padding-right: 20px;
    font-size: 25px;
    border-radius: 25px;
    background-color: gold;
}
</style>
</head>

<body>

<div class="card">

    <div class="cover">
        <img src="https://www.shutterstock.com/image-photo/closeup-weaver-ants-oecophylla-smaragdina-600nw-2502774465.jpg" alt="Ant">
    </div>

    <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        width="50"
        height="50"
         alt="Profile">
    </div>


    <h2>Morgan Sweeney</h2>
    <div class="role">Ant Collector</div>

    <div class="stats">
        <div>
            <h3>12</h3>
            <span>Followers</span>
        </div>

        <div>
            <h3>1000</h3>
            <span>Following</span>
        </div>
    </div>

    <button>Follow</button>

    <p>
        Morgan has collected ants since they were six years old and now has many dozen ants but none in their pants.
    </p>

</div>

</body>
</html>
